name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Релиз 2dust/AndroidLibXrayLite (внутри Xray-core той же версии).
  LIBV2RAY_VERSION: v26.9.9

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download libv2ray.aar (Xray-core) and slim it down
        # Готовый aar весит ~62 МБ: внутри 4 ABI и geo-базы (~28 МБ), которые нам не нужны.
        # Оставляем только arm64-v8a; полные geoip/geosite не нужны — в APK лежат свои урезанные базы (app/src/main/assets/geo).
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${LIBV2RAY_VERSION}/libv2ray.aar"
          zip -d app/libs/libv2ray.aar 'assets/*' 'jni/armeabi-v7a/*' 'jni/x86/*' 'jni/x86_64/*'
          unzip -l app/libs/libv2ray.aar | grep -E "libgojni|classes.jar"
          ls -la app/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        # Один и тот же ключ во всех сборках — иначе Android не даст обновить приложение поверх
        # установленного, а у тестеров придётся каждый раз удалять его вручную.
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for name in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing. Они должны быть в Settings → Secrets and variables → Actions → Secrets → Repository secrets (секреты из раздела Environment secrets этому workflow недоступны)."
            exit 1
          fi

          # Терпим переводы строк и пробелы, которые добавляют онлайн-конвертеры.
          if ! echo "$SIGNING_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/dostup.keystore" 2>/dev/null; then
            echo "::error::SIGNING_KEYSTORE_BASE64 не является корректным base64. Вставьте результат кодирования файла .keystore целиком, без правок."
            exit 1
          fi

          # Проверяем, что хранилище открывается с этими паролем и алиасом, — ошибка будет понятной и сразу.
          if ! keytool -list -keystore "$RUNNER_TEMP/dostup.keystore" -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Хранилище ключей не открывается: проверьте SIGNING_STORE_PASSWORD (пароль), SIGNING_KEY_ALIAS (алиас) и что в SIGNING_KEYSTORE_BASE64 лежит именно ваш файл .keystore."
            exit 1
          fi
          echo "Хранилище ключей в порядке, алиас найден."
          echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/dostup.keystore" >> "$GITHUB_ENV"

      - name: Build APKs (release + debug)
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace

      - name: Verify signature and name the files
        # SHA-256 сертификата должен быть одинаковым во всех сборках — так видно, что ключ тот же.
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "Verified|certificate SHA-256"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/DostupVPN-beta-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/*.apk   "dist/DostupVPN-debug-${GITHUB_RUN_NUMBER}.apk"
          ls -la dist

      # Для тестеров: подписанная релизная сборка (не debuggable, меньше шума в журналах).
      - uses: actions/upload-artifact@v4
        with:
          name: DostupVPN-beta-apk
          path: dist/DostupVPN-beta-*.apk

      # Для разработчика: отладочная сборка (работает adb run-as для чтения логов).
      - uses: actions/upload-artifact@v4
        with:
          name: DostupVPN-debug-apk
          path: dist/DostupVPN-debug-*.apk
